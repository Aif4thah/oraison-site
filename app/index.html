<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="/app/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Oraison, application sobre et silencieuse de prière, chapelet guidé et méditation des mystères du Rosaire à la lumière de la Bible.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Oraison">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Oraison — Chapelet et méditation</title>
  <link rel="canonical" href="https://oraison.app/">
  <script data-goatcounter="https://vacarelm.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="icons/Icon-192.png" as="image">
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">
  <style>
    html, body {
      background-color: #121212;
      color: #EDEDED;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    #splash-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.4s ease-out;
      pointer-events: none;
    }
    #splash-screen.splash-fade-out { opacity: 0; pointer-events: none; }
    .splash-logo { width: 72px; height: 72px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4); animation: splash-pulse 2.2s ease-in-out infinite; }
    .splash-title { font: 400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif; letter-spacing: 1.5px; color: #EDEDED; margin: 18px 0 0; opacity: 0.9; }
    .splash-bar { width: 36px; height: 2px; background: #B06CAE; border-radius: 2px; margin-top: 14px; opacity: 0.6; animation: splash-bar-pulse 2.2s ease-in-out infinite; }
    @keyframes splash-pulse {
      0%, 100% { transform: scale(0.97); opacity: 0.85; }
      50% { transform: scale(1.02); opacity: 1; }
    }
    @keyframes splash-bar-pulse {
      0%, 100% { opacity: 0.3; transform: scaleX(0.7); }
      50% { opacity: 0.9; transform: scaleX(1.1); }
    }
  </style>
</head>
<body>
  <div id="splash-screen" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="Oraison" class="splash-logo" width="72" height="72">
    <h1 class="splash-title">Oraison</h1>
    <div class="splash-bar"></div>
  </div>
  <noscript>
    <p style="padding: 2rem; text-align: center; font-family: Georgia, serif; color: #EDEDED;">
      Oraison nécessite l'activation de JavaScript pour afficher le chapelet interactif et les méditations hors-ligne.
    </p>
  </noscript>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isStandalone = function () {
        return window.navigator.standalone === true ||
          (window.matchMedia && ['standalone', 'fullscreen', 'minimal-ui'].some(function (m) { return window.matchMedia('(display-mode: ' + m + ')').matches; })) ||
          (document.referrer && document.referrer.indexOf('android-app://') !== -1);
      };
      var isTouch = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0 || /Android/i.test(ua);
      var enterFullscreen = function () {
        if (isIOS || isStandalone() || !isTouch || document.fullscreenElement || document.webkitFullscreenElement) return;
        var el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        if (req) { try { var p = req.call(el, { navigationUI: 'hide' }); if (p && p.catch) p.catch(function () {}); } catch (_) {} }
      };
      window.addEventListener('click', enterFullscreen, { passive: true });
      window.addEventListener('touchend', enterFullscreen, { passive: true });

      var dismissed = false;
      window.dismissSplashScreen = function () {
        if (dismissed) return;
        dismissed = true;
        var s = document.getElementById('splash-screen');
        if (s) {
          s.classList.add('splash-fade-out');
          setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 450);
        }
      };
      window.addEventListener('flutter-first-frame', window.dismissSplashScreen);
      setTimeout(window.dismissSplashScreen, 6000);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { if (r.active && r.active.scriptURL && r.active.scriptURL.indexOf('flutter_service_worker.js') !== -1) r.unregister(); });
        });
        window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
      }

      var attempts = 0, standalone = isStandalone();
      function reportOpen() {
        if (window.goatcounter && typeof window.goatcounter.count === 'function') {
          window.goatcounter.count({
            path: standalone ? 'pwa-open-standalone' : 'pwa-open-browser',
            title: standalone ? 'Ouverture PWA (Écran d\'accueil / Standalone)' : 'Ouverture App (Navigateur Web)',
            event: true
          });
        } else if (attempts++ < 20) setTimeout(reportOpen, 150);
      }
      if (document.readyState === 'complete') reportOpen();
      else window.addEventListener('load', reportOpen);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
