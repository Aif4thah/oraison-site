<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Oraison, application sobre et silencieuse de prière, chapelet guidé et méditation des mystères du Rosaire à la lumière de la Bible.">
  <meta name="theme-color" content="#121212">

  <!-- iOS / iPhone PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Oraison">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Oraison — Chapelet et méditation</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background-color: #121212;
      color: #EDEDED;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <noscript>
    <p style="padding: 2rem; text-align: center; font-family: Georgia, serif; color: #EDEDED;">
      Oraison nécessite l'activation de JavaScript pour afficher le chapelet interactif et les méditations hors-ligne.
    </p>
  </noscript>
  <script>
    (function () {
      // Masque automatiquement les barres Chrome / Android / iPadOS (adresse, heure, notifications, navigation)
      // dès le premier contact tactile sur appareil mobile ou tablette.
      var isTouchDevice = function () {
        return (
          (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
          navigator.maxTouchPoints > 0 ||
          /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '')
        );
      };

      var enterImmersiveFullscreen = function () {
        if (!isTouchDevice()) return;
        if (document.fullscreenElement || document.webkitFullscreenElement) return;
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        if (req) {
          try {
            var p = req.call(el, { navigationUI: 'hide' });
            if (p && typeof p.catch === 'function') {
              p.catch(function () {});
            }
          } catch (_) {}
        }
      };

      window.addEventListener('click', enterImmersiveFullscreen, { passive: true });
      window.addEventListener('touchend', enterImmersiveFullscreen, { passive: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
